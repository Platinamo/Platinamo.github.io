<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Platinamo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/products.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="assets/logo.webp" alt="Platinam Logo">
            <div class="title-container">
                <h1>Platinamo</h1>
                <p>Your Trusted Gaming Shop</p>
            </div>
        </div>
        <a href="payment.html" class="cart-icon-container">
            <i class="fas fa-shopping-cart cart-icon"></i>
            <span class="cart-count" id="cart-count">0</span>
        </a>
    </header>

    <div class="boxed-container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Games</a>
        
        <div class="product-top-section">
            <div class="product-header">
                <div class="product-image">
                    <img id="product-img" src="" alt="Product Image">
                </div>
                <h1 class="product-title" id="product-title"></h1>
            </div>
            
            <div class="order-info">
                <div class="order-process">
                    <h2>Order Information</h2>
                    <div class="requirements">
                        <h3>You'll need to provide:</h3>
                        <ul id="game-requirements"></ul>
                    </div>
                    <div class="delivery-info">
                        <h3>After payment:</h3>
                        <p>Your <span id="product-name-delivery"></span> will be delivered instantly to your account</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-fields" id="input-fields">
            <h2>Required Information</h2>
            <!-- Input fields will be dynamically added here -->
        </div>

        <div class="items-list" id="items-list">
            <!-- Item cards will be dynamically added here -->
        </div>

        <div class="cart-panel" id="cart-panel">
            <div class="cart-header">
                <span class="cart-title">Shopping Cart</span>
            </div>
            <div class="cart-items" id="cart-items">
                <!-- Cart items will be dynamically added here -->
            </div>
            <div class="cart-total" id="cart-total">
                Total: ৳ 0.00
            </div>
            <button id="buy-now-btn" class="buy-now-btn" disabled>Add to Cart</button>
        </div>
    </div>

    <script src="js/products.js"></script>
</body>
</html>
