<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Platinamo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/payment.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="assets/logo.webp" alt="Platinam Logo">
            <div class="title-container">
                <h1>Platinamo</h1>
                <p>Your Trusted Gaming Shop</p>
            </div>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
        
        <div class="order-summary">
            <h2 class="section-title">Order Summary</h2>
            
            <div id="game-sections">
                <!-- Game sections with user info and items will be dynamically added here -->
            </div>

            <div class="total-section">
                <div class="total-amount" id="total-amount">Total: ৳ 0.00</div>
            </div>
        </div>
        <button id="place-order-btn" class="buy-now-btn">Place Order</button>
        <button id="clear-cart-btn" class="buy-now-btn">Clear Cart</button>
    </div>

    <script src="js/payment.js"></script>
    <script src="send_to_bot.js"></script>
</body>
</html>
